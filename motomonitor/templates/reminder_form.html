{% extends "layout.html" %}
{% block content %}
<h2>Add Reminder</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Vehicle</label>
                        {% if vehicles %}
                            <select name="vehicle_id" class="form-select" required>
                                {% for v in vehicles %}
                                    <option value="{{ v.id }}">{{ v.nickname or (v.make ~ ' ' ~ v.model) }} ({{ v.registration_number }})</option>
                                {% endfor %}
                            </select>
                        {% else %}
                            <div class="alert alert-warning mb-0">
                                No vehicles found. <a href="{{ url_for('vehicles.add_vehicle') }}">Add a vehicle first</a>.
                            </div>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reminder Type</label>
                        <select name="type" class="form-select" required>
                            <option value="insurance">Insurance</option>
                            <option value="road_tax">Road Tax</option>
                            <option value="puc">PUC</option>
                            <option value="driving_license">Driving License</option>
                            <option value="rc_renewal">RC Renewal</option>
                            <option value="warranty">Warranty</option>
                            <option value="amc">AMC</option>
                            <option value="service">Service</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" name="due_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes (optional)</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Reminder</button>
                    <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
