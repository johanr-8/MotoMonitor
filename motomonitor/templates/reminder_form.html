{% extends "layout.html" %}
{% block content %}
<div class="fade-in-scale">
    <h1 class="page-title">
        <span class="title-icon">&#128276;</span> Add Reminder
    </h1>

    <div class="card-moto" style="max-width:600px;">
        {% if vehicles %}
            <form method="POST" class="form-moto">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Vehicle *</label>
                    <select name="vehicle_id" class="form-select" required>
                        <option value="">Select a vehicle</option>
                        {% for v in vehicles %}
                            <option value="{{ v.id }}">{{ v.make }} {{ v.model }} ({{ v.registration_number }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Reminder Type *</label>
                    <select name="type" class="form-select" required>
                        <option value="">Select type</option>
                        <option value="insurance">🛡️ Insurance Renewal</option>
                        <option value="road_tax">💰 Road Tax</option>
                        <option value="puc">🏷️ PUC (Pollution Certificate)</option>
                        <option value="driving_license">📝 Driving License</option>
                        <option value="rc_renewal">📋 RC Renewal</option>
                        <option value="warranty">🔧 Warranty Expiry</option>
                        <option value="amc">🔧 AMC (Annual Maintenance)</option>
                        <option value="service">🔧 General Service</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Due Date *</label>
                    <input type="date" name="due_date" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Notes (optional)</label>
                    <textarea name="notes" class="form-control" rows="2" placeholder="Any additional notes..."></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-moto">Add Reminder</button>
                    <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-moto-outline">Cancel</a>
                </div>
            </form>
        {% else %}
            <div class="empty-state">
                <div class="empty-icon">&#128663;</div>
                <div class="empty-text">You need to add a vehicle first before creating reminders.</div>
                <a href="{{ url_for('vehicles.add_vehicle') }}" class="btn btn-moto">+ Add Vehicle</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
