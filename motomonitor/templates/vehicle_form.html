{% extends "layout.html" %}
{% block content %}
<div class="fade-in-scale">
    <h1 class="page-title">
        <span class="title-icon">{% if vehicle %}&#9998;{% else %}&#10133;{% endif %}</span>
        {% if vehicle %}Edit Vehicle{% else %}Add Vehicle{% endif %}
    </h1>

    <div class="card-moto" style="max-width:600px;">
        <form method="POST" class="form-moto">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Nickname</label>
                <input type="text" name="nickname" class="form-control" placeholder='e.g. "My CB350"' value="{{ vehicle.nickname if vehicle else '' }}">
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Make *</label>
                    <input type="text" name="make" class="form-control" placeholder="Honda, Royal Enfield..." value="{{ vehicle.make if vehicle else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Model *</label>
                    <input type="text" name="model" class="form-control" placeholder="CB350, Classic 350..." value="{{ vehicle.model if vehicle else '' }}" required>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Registration Number *</label>
                    <input type="text" name="registration_number" class="form-control" placeholder="KA-01-AB-1234" value="{{ vehicle.registration_number if vehicle else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Purchase Date *</label>
                    <input type="date" name="purchase_date" class="form-control" value="{{ vehicle.purchase_date if vehicle else '' }}" required>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-moto">{% if vehicle %}Update Vehicle{% else %}Add Vehicle{% endif %}</button>
                <a href="{{ url_for('vehicles.list_vehicles') }}" class="btn btn-moto-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
