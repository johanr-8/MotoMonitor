{% extends "layout.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in-scale">
        <div class="auth-logo">
            <div class="logo-icon">&#128666;</div>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to manage your vehicles</p>
        <form method="POST" class="form-moto" style="position:relative;z-index:1;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-moto w-100 py-2">Sign In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.signup') }}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
